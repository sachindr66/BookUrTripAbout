<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- SEO Meta Tags -->
    <title>BookUrTrip - Premium Travel Booking Platform | Flights, Hotels, Buses, Trains</title>
    <meta name="description" content="Book flights, hotels, buses, trains, cabs, and cruises with BookUrTrip. Premium travel booking platform with best prices, instant confirmations, and 24/7 support." />
    <meta name="keywords" content="travel booking, flights, hotels, buses, trains, cabs, cruises, travel deals, online booking, cheap flights, hotel booking, train tickets, bus tickets" />
    <meta name="author" content="BookUrTrip" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.BookUrTrip.com" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="BookUrTrip - Premium Travel Booking Platform" />
    <meta property="og:description" content="Your one-stop solution for all travel needs. Book with confidence and travel with ease." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.BookUrTrip.com" />
    <meta property="og:image" content="https://www.BookUrTrip.com/logo.png" />
    <meta property="og:site_name" content="BookUrTrip" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookUrTrip - Premium Travel Booking Platform" />
    <meta name="twitter:description" content="Your one-stop solution for all travel needs. Book with confidence and travel with ease." />
    <meta name="twitter:image" content="https://www.BookUrTrip.com/logo.png" />
    
    <!-- Mobile Optimizations -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BookUrTrip" />
    <meta name="theme-color" content="#d50000" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/src/assets/logo.png" as="image" type="image/png" />
    
    <!-- Optimized font loading -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "BookUrTrip",
      "description": "Premium travel booking platform for flights, hotels, buses, trains, cabs, and cruises",
      "url": "https://www.BookUrTrip.com",
      "logo": "https://www.BookUrTrip.com/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://www.BookUrTrip.com"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
